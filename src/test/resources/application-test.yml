spring:
  datasource:
    url: jdbc:h2:mem:geupjido;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
