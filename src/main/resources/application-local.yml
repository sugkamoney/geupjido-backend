spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/geupjido}
    username: ${DB_USERNAME:geupjido}
    password: ${DB_PASSWORD:geupjido-local}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  location-import:
    enabled: ${LOCATION_IMPORT_ENABLED:false}
    mapping-path: ${LOCATION_MAPPING_PATH:}
    boundary-path: ${LOCATION_BOUNDARY_PATH:}
    code-property: ${LOCATION_CODE_PROPERTY:}

  complex-import:
    enabled: ${COMPLEX_IMPORT_ENABLED:false}
    schedule-enabled: ${COMPLEX_IMPORT_SCHEDULE_ENABLED:false}
    schedule-cron: ${COMPLEX_IMPORT_SCHEDULE_CRON:0 0 2 1 * *}
    request-interval: ${COMPLEX_IMPORT_REQUEST_INTERVAL:0ms}
    mapping-path: ${COMPLEX_IMPORT_MAPPING_PATH:data/location/mapping/location-mapping.json}

  geocoding-probe:
    enabled: ${GEOCODING_PROBE_ENABLED:false}
    complex-id: ${GEOCODING_PROBE_COMPLEX_ID:}

  complex-location-import:
    enabled: ${COMPLEX_LOCATION_IMPORT_ENABLED:false}
    complex-id: ${COMPLEX_LOCATION_IMPORT_COMPLEX_ID:}
    schedule-enabled: ${COMPLEX_LOCATION_SCHEDULE_ENABLED:false}
    batch-enabled: ${COMPLEX_LOCATION_BATCH_ENABLED:false}
    batch-after-id: ${COMPLEX_LOCATION_BATCH_AFTER_ID:}
    batch-max-count: ${COMPLEX_LOCATION_BATCH_MAX_COUNT:1}
    batch-manifest-path: ${COMPLEX_LOCATION_BATCH_MANIFEST_PATH:data/complex/location-runs/local.jsonl}

  external:
    geocoding:
      enabled: ${NAVER_GEOCODING_ENABLED:false}
      base-url: ${NAVER_GEOCODING_BASE_URL:https://maps.apigw.ntruss.com/map-geocode/v2}
      client-id: ${NAVER_MAPS_CLIENT_ID:}
      client-secret: ${NAVER_MAPS_CLIENT_SECRET:}
    complex-list:
      enabled: ${DATA_GO_KR_APT_LIST_ENABLED:false}
      base-url: ${DATA_GO_KR_APT_LIST_BASE_URL:}
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
    complex-basic-info:
      enabled: ${DATA_GO_KR_APT_BASIC_INFO_ENABLED:false}
      base-url: ${DATA_GO_KR_APT_BASIC_INFO_BASE_URL:}
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
    apartment-trade:
      enabled: ${DATA_GO_KR_APT_TRADE_ENABLED:false}
      base-url: ${DATA_GO_KR_APT_TRADE_BASE_URL:}
      service-key: ${DATA_GO_KR_SERVICE_KEY:}

  apartment-trade-import:
    enabled: ${APARTMENT_TRADE_IMPORT_ENABLED:false}
    district-code: ${APARTMENT_TRADE_IMPORT_DISTRICT_CODE:}
    deal-year-month: ${APARTMENT_TRADE_IMPORT_DEAL_YEAR_MONTH:}

  apartment-trade-match:
    enabled: ${APARTMENT_TRADE_MATCH_ENABLED:false}
    audit-enabled: ${APARTMENT_TRADE_MATCH_AUDIT_ENABLED:false}
    audit-path: ${APARTMENT_TRADE_MATCH_AUDIT_PATH:build/reports/apartment-trade-match-audit.tsv}
    proposal-path: ${APARTMENT_TRADE_MATCH_PROPOSAL_PATH:data/trade/matching/yongsan-202609-proposals.tsv}
    reference-path: ${APARTMENT_TRADE_MATCH_REFERENCE_PATH:data/location/reference/legal-dongs-20260917.tsv}
    mapping-path: ${APARTMENT_TRADE_MATCH_MAPPING_PATH:data/location/mapping/location-mapping.json}
