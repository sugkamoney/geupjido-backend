spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/geupjido}
    username: ${DB_USERNAME:geupjido}
    password: ${DB_PASSWORD:geupjido-local}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  location-import:
    enabled: ${LOCATION_IMPORT_ENABLED:false}
    mapping-path: ${LOCATION_MAPPING_PATH:}
    boundary-path: ${LOCATION_BOUNDARY_PATH:}
    code-property: ${LOCATION_CODE_PROPERTY:}

  external:
    complex-list:
      enabled: ${DATA_GO_KR_APT_LIST_ENABLED:false}
      base-url: ${DATA_GO_KR_APT_LIST_BASE_URL:}
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
