spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  anonymous-cookie:
    secure: ${ANONYMOUS_COOKIE_SECURE:true}

  worldcup-cors:
    allowed-origins: ${WORLDCUP_CORS_ALLOWED_ORIGINS:}

  worldcup-rating:
    schedule-enabled: ${WORLDCUP_RATING_SCHEDULE_ENABLED:true}
    schedule-cron: ${WORLDCUP_RATING_SCHEDULE_CRON:0 0 */3 * * *}
