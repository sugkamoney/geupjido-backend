services:
  postgres:
    image: kartoza/postgis:16-3.4
    container_name: geupjido-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geupjido}
      POSTGRES_USER: ${POSTGRES_USER:-geupjido}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-geupjido-local}
      ALLOW_IP_RANGE: 0.0.0.0/0
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: geupjido-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
