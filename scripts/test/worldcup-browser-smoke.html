<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>월드컵 브라우저 쿠키·CORS 확인</title>
  <style>
    body { max-width: 760px; margin: 48px auto; padding: 0 20px; font: 16px/1.6 system-ui, sans-serif; }
    button { margin: 8px 8px 8px 0; padding: 8px 14px; cursor: pointer; }
    input { width: 280px; padding: 7px; }
    pre { padding: 16px; background: #f4f4f4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .pass { color: #087a32; } .fail { color: #b00020; }
  </style>
</head>
<body>
  <h1>월드컵 브라우저 검증</h1>
  <p>이 페이지는 로컬 검증 전용입니다. 방문자 쿠키는 JavaScript에서 읽지 않고 브라우저가 요청에 실어 보냅니다.</p>
  <label>API 주소 <input id="api-base" value="http://localhost:18080"></label>
  <p>
    <button id="run-allowed">게임 시작 → 1표 저장 → 재조회</button>
    <button id="run-blocked">허용하지 않은 출처 확인</button>
    <button id="check-current">새로고침 후 이어하기 확인</button>
  </p>
  <p id="result" role="status">대기 중</p>
  <pre id="details"></pre>
  <script>
    const result = document.querySelector('#result');
    const details = document.querySelector('#details');
    const apiBase = document.querySelector('#api-base');

    function report(ok, message, data) {
      result.className = ok ? 'pass' : 'fail';
      result.textContent = `${ok ? 'PASS' : 'FAIL'}: ${message}`;
      document.body.dataset.smokeResult = ok ? 'pass' : 'fail';
      details.textContent = data ? JSON.stringify(data, null, 2) : '';
    }

    async function api(path, options = {}) {
      const response = await fetch(`${apiBase.value.replace(/\/$/, '')}${path}`, {
        ...options,
        credentials: 'include',
        cache: 'no-store'
      });
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error(`${response.status} ${body?.code ?? ''} ${body?.message ?? ''}`);
      }
      return { status: response.status, body };
    }

    document.querySelector('#run-allowed').addEventListener('click', async () => {
      try {
        const zones = (await api('/api/v1/worldcup/zones')).body;
        const zone = zones.find(item => item.canStart);
        if (!zone) throw new Error('시작 가능한 권역이 없습니다.');

        const started = await api(`/api/v1/worldcup/zones/${encodeURIComponent(zone.zoneId)}/games`, {
          method: 'POST'
        });
        if (started.status !== 201 || started.body.nextRoundNumber !== 1) {
          throw new Error('새 게임이 생성되지 않았습니다. 새 브라우저 프로필 또는 쿠키 삭제 후 재시도하세요.');
        }
        const first = started.body.matchups[0];
        const voted = (await api('/api/v1/worldcup/games/current/rounds/1/vote', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selectedComplexId: first.left.complexId })
        })).body;
        const current = (await api('/api/v1/worldcup/games/current')).body;
        const sameMatchups = JSON.stringify(started.body.matchups) === JSON.stringify(current.matchups);
        const persisted = voted.nextRoundNumber === 2
          && current.nextRoundNumber === 2
          && current.selections.length === 1
          && current.selections[0].selectedComplexId === first.left.complexId
          && sameMatchups
          && !document.cookie.includes('gjd_uid=');
        report(persisted, '선택 저장과 같은 브라우저 재조회', {
          origin: location.origin,
          zoneId: zone.zoneId,
          nextRoundNumber: current.nextRoundNumber,
          selection: current.selections[0],
          sameMatchups,
          cookieVisibleToJavaScript: document.cookie.includes('gjd_uid=')
        });
      } catch (error) {
        report(false, error.message);
      }
    });

    document.querySelector('#check-current').addEventListener('click', async () => {
      try {
        const current = (await api('/api/v1/worldcup/games/current')).body;
        const persisted = current.nextRoundNumber === 2
          && current.selections.length === 1
          && !document.cookie.includes('gjd_uid=');
        report(persisted, '새로고침 후 1표와 다음 판 유지', {
          origin: location.origin,
          nextRoundNumber: current.nextRoundNumber,
          selections: current.selections,
          cookieVisibleToJavaScript: document.cookie.includes('gjd_uid=')
        });
      } catch (error) {
        report(false, error.message);
      }
    });

    document.querySelector('#run-blocked').addEventListener('click', async () => {
      if (location.origin !== 'http://localhost:5176') {
        report(false, '이 버튼은 http://localhost:5176 에서 실행해야 합니다.');
        return;
      }
      try {
        const reachable = await fetch(`${apiBase.value.replace(/\/$/, '')}/api/v1/worldcup/zones`, {
          mode: 'no-cors', credentials: 'include'
        });
        if (reachable.type !== 'opaque') throw new Error('API 연결 상태를 확인할 수 없습니다.');
        await api('/api/v1/worldcup/zones');
        report(false, '허용하지 않은 출처에서 응답을 읽었습니다.');
      } catch (error) {
        report(error instanceof TypeError, '허용하지 않은 출처의 브라우저 요청 차단', {
          origin: location.origin,
          error: error.message
        });
      }
    });

    const automatedCheck = new URLSearchParams(location.search).get('run');
    const buttonIds = { allowed: 'run-allowed', current: 'check-current', blocked: 'run-blocked' };
    if (location.protocol === 'file:') {
      report(false, '파일을 직접 열면 CORS 검증을 할 수 없습니다. 로컬 서버 실행 후 http://localhost:5173/worldcup-browser-smoke.html 로 접속하세요.');
      Object.values(buttonIds).forEach(id => { document.getElementById(id).disabled = true; });
    } else if (buttonIds[automatedCheck]) {
      document.querySelector(`#${buttonIds[automatedCheck]}`).click();
    }
  </script>
</body>
</html>
